<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="mock.css">
<style>
  body { background: linear-gradient(160deg, #0b1017, #07090d 60%) !important; }
  .col { position: absolute; top: 96px; display: flex; flex-direction: column; gap: 22px; }
  .blk > .h { margin-bottom: 8px; color: var(--text); font-size: 17px; }
  .blk > .why { color: var(--dim); font-size: 13px; margin: -4px 0 9px; max-width: 540px; line-height: 1.3; }
  .card { background: var(--panel); border: 1px solid var(--line); padding: 12px; position: relative; }
  .sw { display: grid; grid-template-columns: 22px 92px 1fr; align-items: center; column-gap: 10px; row-gap: 6px; }
  .sw i { width: 22px; height: 14px; }
  .ty { display: grid; grid-template-columns: 1fr auto; align-items: baseline; row-gap: 5px; column-gap: 12px; }
  .ty > :nth-child(even) { color: var(--faint); font-size: 12px; }
  .demo { position: relative; height: 150px; }
  .demo .win { box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5); }
  .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .cap { color: var(--faint); font-size: 12px; margin-top: 3px; }
  .lst .thead, .lst .row { grid-template-columns: 1fr 70px 70px 54px; }
  .dk { display: flex; gap: 22px; }
  .dk .b { width: 44px; height: 42px; display: flex; align-items: center; justify-content: center; position: relative; color: var(--dim); background: rgba(8,12,18,0.95); border-right: 1px solid var(--line); }
  .dk .b.open { color: var(--text); background: rgba(22, 44, 62, 0.95); } .dk .b.open::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px; background: var(--accent); }
  .dk .b.hot { color: #fff; background: rgba(30, 38, 50, 0.98); } .dk .b.off { opacity: 0.3; }
  .dk .badge { position: absolute; right: 3px; top: 3px; min-width: 15px; height: 15px; font: 600 11px/15px R; background: var(--warn); color: #14110a; text-align: center; padding: 0 3px; }
  .dk > div { text-align: center; } .dk .cap { margin-top: 5px; }
  .cells { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; } .cells i { height: 12px; background: rgba(255, 230, 128, 0.16); } .cells i.f { background: var(--cap); }
</style></head>
<body class="space">
<script src="mock.js"></script>
<script>
put(`<div style="position:absolute;left:44px;top:26px"><div style="font:30px I;letter-spacing:3px">THE KIT</div>
  <div class="dim" style="margin-top:2px">What every window is to be made of: one set of colours and sizes, one list, one of each control. Built once, before any window.</div></div>`);

// ---- Column one: colour and type.
const sw = (c, n, t) => `<i style="background:${c}"></i><span class="b5">${n}</span><span class="dim">${t}</span>`;
put(`<div class="col" style="left:44px;width:560px">
  <div class="blk"><div class="h">Colour says one thing each</div>
    <div class="card"><div class="sw">
      ${sw('#33b3ff', 'Accent', 'what is picked, what the cursor is on, what a press does')}
      ${sw('#73d98c', 'Good', 'yours, a gain, a thing done, safe space')}
      ${sw('#ffcc47', 'Caution', 'where you are going, a warning, a thing wanted')}
      ${sw('#e0604f', 'Bad', 'hostile, a loss, a refusal, why a button is off')}
      ${sw('#d1dbe6', 'Text', 'what is to be read')}
      ${sw('#808c99', 'Dim', 'labels, units, what matters less')}
      ${sw('#56616d', 'Faint', 'what is there but not for you now')}
    </div>
    <div style="display:flex;gap:16px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;white-space:nowrap;align-items:center">
      <span class="dim">a ship's:</span>${[['shield', 'Shield'], ['armor', 'Armour'], ['hull', 'Hull'], ['cap', 'Capacitor']].map(([c, n]) => `<span style="display:flex;align-items:center;gap:5px"><b style="width:10px;height:10px;background:var(--${c})"></b>${n}</span>`).join('')}</div>
    <div style="display:flex;gap:16px;margin-top:8px;font-size:13px;white-space:nowrap"><span class="dim">damage:</span><span style="color:#59a6ff">EM</span><span style="color:#e0604f">Thermal</span><span style="color:#a3b0bd">Kinetic</span><span style="color:#f2a23d">Explosive</span></div></div></div>
  <div class="blk"><div class="h">Type</div>
    <div class="card"><div class="ty">
      <span style="font:26px/1 I;letter-spacing:2px">RASISOS</span><span>a place's name: Iceland 26</span>
      <span style="font:16px I;letter-spacing:1.8px">MARKET &nbsp; INVENTORY</span><span>a window's title: Iceland 16, capitals</span>
      <span class="b6" style="font-size:18px">Small Autocannon</span><span>the thing a pane is about: 18, heavy</span>
      <span>Small projectile turret, 5 m3</span><span>everything else: Rajdhani 14</span>
      <span class="dim" style="font-size:12px">412 in stock &nbsp;-&nbsp; 3 jumps</span><span>a note: 12</span>
      <span style="font:600 11px R;letter-spacing:0.9px;color:var(--accent)">OFFENCE &nbsp; DEFENCE</span><span>a section's head: 11, capitals</span>
      <span class="b6" style="font-size:20px">49,724,599 <span class="dim" style="font-size:13px;font-weight:400">cr</span></span><span>figures: thousands apart, set to the right, the unit dim</span>
    </div></div></div>
  <div class="blk"><div class="h">Notices</div><div class="why">By what they are. Today every one is the same orange-red, good news or bad.</div>
    <div style="display:grid;gap:6px;width:420px">
      <div class="toast good"><span>Bounty paid: Pirate Scout</span><span class="good b6">+45,000 cr</span><span class="sp"></span><span class="t">just now</span></div>
      <div class="toast warn"><span>Capacitor below a quarter</span><span class="sp"></span><span class="t">3 s ago</span></div>
      <div class="toast bad"><span>The lock was refused: out of range</span><span class="sp"></span><span class="t">8 s ago</span></div>
      <div class="toast"><span>Guide: "Hire a pilot" is done</span><span class="dim">1 of 27</span><span class="sp"></span><span class="t">20 s ago</span></div></div></div>
  <div class="blk"><div class="h">Bars</div>
    <div class="card" style="display:grid;grid-template-columns:70px 1fr 90px;gap:8px 10px;align-items:center;width:420px">
      <span class="dim">Shield</span><div class="bar2" style="height:8px"><i style="width:64%;background:var(--shield)"></i></div><span class="num">224 <span class="faint">/ 350</span></span>
      <span class="dim">Capacitor</span><div class="cells">${Array.from({ length: 20 }, (_, i) => `<i class="${i < 13 ? 'f' : ''}"></i>`).join('')}</div><span class="num">198 <span class="faint">/ 305</span></span>
      <span class="dim">A job</span><div class="bar2" style="height:6px"><i style="width:32%;background:var(--accent)"></i></div><span class="num dim">6m 10s</span></div></div>
</div>`);

// ---- Column two: the window and its controls.
const mini = (focus, x, title, sub) => `<div class="win ${focus ? 'focus' : ''}" style="left:${x}px;top:0;width:276px;height:146px">
  <div class="bar"><span class="wi">${ic('wallet', 16, 1.7)}</span><span class="title">${title}</span><span class="sp"></span><span class="ctl"><span>${ic('pin', 14, 1.6)}</span><span>${ic('close', 14, 1.8)}</span></span></div>
  <div class="tabs"><span class="tab on">Mine</span><span class="tab">Corporation</span></div>
  <div class="pad dim" style="font-size:13px;line-height:1.3">${sub}</div><div class="grip"></div></div>`;
put(`<div class="col" style="left:664px;width:580px">
  <div class="blk"><div class="h">A window</div><div class="why">Moved by its bar, sized by its corner, kept where it is put. A new one opens beside the others, never on top of one. The pin keeps it open in space.</div>
    <div class="demo">${mini(true, 0, 'Wallet', 'In front: a line of the accent along its top, its title bright.')}${mini(false, 292, 'Wallet', 'Behind: the same window, quiet.')}</div></div>
  <div class="blk"><div class="h">Buttons</div>
    <div class="card"><div class="line"><span class="btn">Plain</span><span class="btn hot">Cursor on it</span><span class="btn pri">The main thing to do</span><span class="btn danger">STOP</span><span class="btn off">Cannot now</span></div>
      <div class="line" style="margin-top:10px"><span class="btn sm">Small</span><span class="btn sm">10</span><span class="btn sm">100</span><span class="btn sm">All</span><span class="sp"></span><span class="btn big pri" style="width:210px">Buy 4 &nbsp;<span class="b6">33,600 cr</span></span></div>
      <div style="position:relative;height:50px"><div class="tip" style="left:236px;top:6px"><span class="bad">Cannot now:</span> 12,400 cr short<div class="t2">A button that is off says why, when the cursor is on it.</div></div></div></div></div>
  <div class="blk"><div class="h">Tabs, switches, a field</div>
    <div class="card"><div class="tabs" style="padding:0;margin-bottom:12px"><span class="tab on">Browse</span><span class="tab">My orders <i>2</i></span><span class="tab">Contracts <i>5</i></span><span class="sp"></span><span class="note">pages of one window</span></div>
      <div class="chips"><span class="chip on">Sold here</span><span class="chip">I can use</span><span class="lab">Tier</span><span class="chip on">All</span><span class="chip">Tech 1</span><span class="chip">Tech 2</span><span class="sp"></span><span class="cap" style="margin:0">what a list is narrowed by</span></div>
      <div class="line" style="margin-top:12px"><div class="field" style="width:230px">${ic('search', 14, 1.8)}<span>Search every category</span></div>
        <div class="field on" style="width:230px">${ic('search', 14, 1.8)}<span style="color:var(--text)">autoc</span><span class="caret"></span></div></div></div></div>
  <div class="blk"><div class="h">The dock's buttons</div>
    <div class="card dk"><div><div class="b">${ic('market', 24, 1.5)}</div><div class="cap">shut</div></div>
      <div><div class="b open">${ic('inventory', 24, 1.5)}</div><div class="cap">open</div></div>
      <div><div class="b">${ic('jobs', 24, 1.5)}<span class="badge">2</span></div><div class="cap">has news</div></div>
      <div><div class="b off">${ic('fitting', 24, 1.5)}</div><div class="cap">not here</div></div>
      <div style="position:relative"><div class="b hot">${ic('skills', 24, 1.5)}</div><div class="cap">cursor on</div>
        <div class="tip" style="left:52px;top:0">Skills<div class="t2">Navigation 2 trains for another 41 s</div></div></div></div></div>
</div>`);

// ---- Column three: the one list.
const lr = (icon, name, a, b, c, cls = '', extra = '') => `<div class="row ${cls}"><div class="nm">${ii(icon)}<span>${name}</span>${extra}</div><div class="num">${a}</div><div class="num dim">${b}</div><div class="num dim">${c}</div></div>`;
put(`<div class="col" style="left:1304px;width:572px">
  <div class="blk"><div class="h">The one list</div><div class="why">Every list in the game is this one: the market's, the hangar's, the skills', the overview's, the journal's. Its heads sort, it is narrowed from above, its rows are picked, and it says how much of it there is.</div>
    <div class="card lst" style="padding:0;display:flex;flex-direction:column;height:372px">
      <div class="pad" style="display:flex;gap:6px;padding-bottom:8px"><div class="field" style="flex:1">${ic('search', 14, 1.8)}<span>Filter</span></div><span class="chip on" style="height:26px">Sold here</span><span class="chip" style="height:26px">I can use</span></div>
      <div class="thead"><div>Item</div><div class="num s">Ask &nbsp;v</div><div class="num">Bid</div><div class="num">Stock</div></div>
      <div class="rows">
        <div class="row group" style="grid-template-columns:1fr auto"><div class="nm">${chev(true)}<span>Projectile turrets</span></div><div class="faint" style="letter-spacing:0;text-transform:none;font-weight:400">4 kinds</div></div>
        ${lr('gun', 'Large Autocannon', '1,480,000', '1,390,000', '22')}
        ${lr('gun', 'Medium Autocannon', '142,000', '131,500', '96', 'sel')}
        ${lr('gun', 'Small Artillery', '11,200', '10,300', '260', 'hot')}
        ${lr('gun', 'Small Autocannon', '8,400', '7,900', '412')}
        <div class="row group" style="grid-template-columns:1fr auto"><div class="nm">${chev(true)}<span>Laser turrets</span></div><div class="faint" style="letter-spacing:0;text-transform:none;font-weight:400">3 kinds</div></div>
        ${lr('laser', 'Medium Pulse Laser', '116,200', '108,000', '64', 'sub', '<span class="pill bad" style="flex:none">needs Laser Turrets 1</span>')}
        ${lr('laser', 'Small Beam Laser', '14,200', '13,100', '150', 'sub')}
        ${lr('laser', 'Small Pulse Laser', '11,600', '10,700', '188', 'sub')}
        <div class="row group" style="grid-template-columns:1fr auto"><div class="nm">${chev(false)}<span>Hybrid turrets</span></div><div class="faint" style="letter-spacing:0;text-transform:none;font-weight:400">4 kinds</div></div>
        <div class="thumb" style="top:2px;height:150px"></div>
        <div class="tip" style="left:300px;top:104px">Small Artillery<div class="t2">Small projectile turret: far, hard, slow.</div></div></div>
      <div class="foot"><span>11 of 24 shown</span><span class="sp"></span><span>13 hidden by "Sold here"</span></div></div>
    <div style="display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px;font-size:13px" class="dim">
      <span class="acc b5">Picked</span><span>a bar of the accent at its left, and a tint</span>
      <span style="color:#fff" class="b5">Cursor on</span><span>a lighter row; a long name or a refusal in full beside it</span>
      <span class="b5">Dim</span><span>what you cannot use or buy yet, with the reason on the row</span>
      <span class="b5" style="color:var(--text)">Heads</span><span>a click sorts by that column, another turns it round</span>
      <span class="b5" style="color:var(--text)">Thumb</span><span>there whenever there is more than fits</span></div></div>
  <div class="blk"><div class="h">Size</div>
    <div class="card dim" style="font-size:13px;line-height:1.35">Everything above is drawn at one size here, for a screen 1080 high. A setting of 100, 125 or 150 per cent would draw all of it larger, for a larger screen or tired eyes. <span style="color:var(--text)">Whether it is wanted is yours to say.</span></div></div>
</div>`);
</script>
</body></html>
