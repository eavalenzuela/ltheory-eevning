<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="mock.css">
<style>
  .hud { position: absolute; background: var(--panel); border: 1px solid var(--line); }
  .ov .thead, .ov .row { grid-template-columns: 20px 1fr 62px 62px 46px; column-gap: 8px; padding: 0 8px; }
  .ov .row .st { position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; }
  .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .acts .btn { padding: 0 6px; justify-content: flex-start; }
  .tg { width: 196px; height: 78px; padding: 7px 9px; background: var(--panel); border: 1px solid var(--line); position: relative; }
  .tg.on { border-color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }
  .tg .n { display: flex; align-items: baseline; gap: 6px; } .tg .n b { font-weight: 600; font-size: 15px; }
  .tg .bars { display: grid; gap: 2px; margin-top: 6px; } .tg .bars .bar2 { height: 4px; }
  .mod { width: 44px; height: 44px; background: rgba(17, 24, 34, 0.94); border: 1px solid var(--line2); position: relative; display: flex;
    align-items: center; justify-content: center; color: #cfe0f0; }
  .mod .k { position: absolute; left: 3px; top: 1px; font: 600 10px R; color: var(--dim); }
  .mod .a { position: absolute; right: 3px; top: 1px; font: 600 11px R; color: var(--text); }
  .mod.on { border-color: var(--good); color: #fff; background: rgba(28, 54, 40, 0.94); }
  .mod .cy { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(115, 217, 140, 0.18); }
  .mod .cy i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--good); }
  .mod.passive { color: var(--faint); border-color: var(--line); background: rgba(8, 12, 18, 0.7); }
  .mod.empty { border-style: dashed; border-color: var(--line); background: rgba(8, 12, 18, 0.5); }
  .rack { display: flex; gap: 4px; align-items: center; }
  .rackl { font: 600 10px R; letter-spacing: 1px; color: var(--dim); width: 30px; text-shadow: 0 1px 2px #000; }
  .stat { display: grid; grid-template-columns: 52px 1fr 86px; align-items: center; column-gap: 8px; row-gap: 7px; }
  .stat .bar2 { height: 8px; }
  .cells { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; }
  .cells i { height: 14px; background: rgba(255, 230, 128, 0.16); } .cells i.f { background: var(--cap); }
  .br { position: absolute; width: 30px; height: 30px; }
  .br::before, .br::after { content: ""; position: absolute; width: 8px; height: 8px; border: 2px solid currentColor; }
  .br::before { left: 0; top: 0; border-right: 0; border-bottom: 0; } .br::after { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  .br i { position: absolute; right: 0; top: 0; width: 8px; height: 8px; border: 2px solid currentColor; border-left: 0; border-bottom: 0; }
  .br b { position: absolute; left: 0; bottom: 0; width: 8px; height: 8px; border: 2px solid currentColor; border-right: 0; border-top: 0; }
  .brl { position: absolute; font: 500 13px R; white-space: nowrap; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
  .job { padding: 7px 10px; border-top: 1px solid var(--line); }
</style></head>
<body class="space">
<script src="mock.js"></script>
<script>
dock({ open: ['jobs'], off: ['fitting', 'ships', 'market', 'industry'], badge: { jobs: 2 } });
where({ system: 'Rasisos', security: '1.0 secure', owner: 'Vessari', region: 'Ulos, Belaron Drift',
  at: 'In space <span class="dim">&nbsp;by Rasisos III - Moon 2</span>', ship: 'Akashi &nbsp;-&nbsp; Vessari Akashi', wallet: '49,724,599' });

// ---- Jobs in hand, and where the pilot means to go: seen in space as well as docked.
put(`<div class="hud" style="left:64px;top:124px;width:352px">
  <div style="display:flex;align-items:center;padding:7px 10px"><span class="h">In hand &nbsp;2</span><span class="sp"></span><span class="dim" style="font-size:12px">Jobs window: J</span></div>
  <div class="job"><div style="display:flex"><span class="b5">Bounty: 2 pirates</span><span class="sp"></span><span class="dim">2d 23h</span></div>
    <div class="dim" style="font-size:13px">here in Rasisos &nbsp;-&nbsp; 1 of 2 destroyed</div><div class="bar2" style="margin-top:5px;height:4px"><i style="width:50%;background:var(--good)"></i></div></div>
  <div class="job"><div style="display:flex"><span class="b5">Courier: 40 m3 to Draum III</span><span class="sp"></span><span class="dim">3d 00h</span></div>
    <div class="dim" style="font-size:13px">2 jumps &nbsp;-&nbsp; aboard, not yet delivered</div></div>
  <div class="job" style="display:flex;align-items:center;gap:8px"><span class="warn b5">To Draum</span><span class="dim">2 jumps, by the safest way</span><span class="sp"></span><span class="btn sm">Autopilot</span></div></div>`);

// ---- What is locked: each with what is left of it, and how far.
const tg = (name, kind, dist, speed, s, a, h, cls, extra) => `<div class="tg ${cls}"><div class="n"><b class="${cls === 'on' ? '' : ''}">${name}</b><span class="sp"></span>${extra || ''}</div>
  <div style="display:flex;font-size:13px"><span class="dim">${kind}</span><span class="sp"></span><span>${dist}</span><span class="dim" style="margin-left:8px">${speed}</span></div>
  <div class="bars"><div class="bar2"><i style="width:${s}%;background:var(--shield)"></i></div><div class="bar2"><i style="width:${a}%;background:var(--armor)"></i></div><div class="bar2"><i style="width:${h}%;background:var(--hull)"></i></div></div></div>`;
put(`<div style="position:absolute;left:560px;top:12px;display:flex;gap:6px">
  ${tg('Pirate Raider', 'Frigate', '7.2 km', '212 m/s', 0, 46, 100, 'on', '<span class="pill acc">target</span>')}
  ${tg('Pirate Scout', 'Frigate', '15.6 km', '340 m/s', 82, 100, 100, '', '')}
  <div class="tg"><div class="n"><b class="dim">Gun Battery</b><span class="sp"></span><span class="dim" style="font-size:12px">locking 2.1 s</span></div>
    <div style="display:flex;font-size:13px"><span class="dim">Battery</span><span class="sp"></span><span>5.7 km</span></div>
    <div class="bar2" style="margin-top:12px;height:4px"><i style="width:62%;background:var(--accent)"></i></div></div></div>`);
put(`<div class="toasts" style="left:560px;top:100px"><div class="toast good"><span>Pirate Scout's shield is down</span><span class="t">4 s ago</span></div>
  <div class="toast warn"><span>Pell Ulenis is taking fire</span><span class="t">9 s ago</span></div></div>`);

// ---- What is selected.
put(`<div class="hud" style="left:1508px;top:12px;width:400px;padding:9px 10px 10px">
  <div style="display:flex;align-items:baseline;gap:8px"><span class="b6" style="font-size:17px">Pirate Raider</span><span class="pill bad">hostile</span><span class="sp"></span><span class="b5">7.2 km</span></div>
  <div style="display:flex;font-size:13px;margin:1px 0 8px"><span class="dim">Frigate &nbsp;-&nbsp; Unbound</span><span class="sp"></span><span class="dim">212 m/s, across you at 0.03 rad/s</span></div>
  <div class="acts"><span class="btn">Approach</span><span class="btn">Orbit 5 km<span class="sp"></span>${ic('down', 11, 2.2)}</span><span class="btn">Keep 10 km<span class="sp"></span>${ic('down', 11, 2.2)}</span>
    <span class="btn">Align</span><span class="btn off">Warp to</span><span class="btn off">Dock</span>
    <span class="btn pri">Unlock</span><span class="btn off">Loot</span><span class="btn">${ic('info', 13, 1.8)} Info</span></div></div>`);

// ---- The overview: a preset to a tab.
const rows = [
  ['ship', 'Pirate Raider', 'Frigate', '7.2 km', '212', 'bad', 'sel'], ['ship', 'Pirate Scout', 'Frigate', '15.6 km', '340', 'bad'],
  ['ship', 'Pell Ulenis', 'Frigate', '2.1 km', '180', 'good'], ['drone', 'Light Combat Drone', 'Drone', '6.9 km', '410', 'good'],
  ['drone', 'Light Combat Drone', 'Drone', '7.0 km', '396', 'good'], ['ship', 'Vessari Yoruzake', 'Freighter', '22.4 km', '0', 'acc'],
  ['ship', 'Prospector', 'Barge', '31.0 km', '12', 'acc'], ['ship', 'Prospector', 'Barge', '33.8 km', '9', 'acc'],
  ['battery', 'Gun Battery', 'Battery', '5.7 km', '-', 'acc'], ['battery', 'Missile Battery', 'Battery', '5.9 km', '-', 'acc'],
  ['battery', 'Gun Battery', 'Battery', '8.7 km', '-', 'acc'], ['battery', 'Gun Battery', 'Battery', '11.7 km', '-', 'acc'],
  ['battery', 'Missile Battery', 'Battery', '14.2 km', '-', 'acc'], ['battery', 'Missile Battery', 'Battery', '17.1 km', '-', 'acc'],
];
const tone = { bad: 'var(--bad)', good: 'var(--good)', acc: 'rgba(89,166,255,0.75)' };
put(`<div class="hud ov" style="left:1508px;top:160px;width:400px;height:470px;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;padding:6px 6px 0 10px"><span class="h">Overview</span><span class="sp"></span><span class="btn sm">Mark here</span>
    <span style="width:26px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--dim)">${ic('gear', 15, 1.6)}</span></div>
  <div class="tabs" style="padding:0 6px;height:30px">${['Default', 'Combat', 'Mining', 'Exploration', 'Travel', 'Salvaging'].map(t => `<span class="tab ${t === 'Combat' ? 'on' : ''}" style="padding:0 7px;font-size:13px">${t}</span>`).join('')}</div>
  <div class="thead"><div></div><div>Name</div><div>Type</div><div class="num s">Distance ^</div><div class="num">m/s</div></div>
  <div class="rows">${rows.map(([icon, name, type, dist, speed, t, sel]) => `<div class="row ${sel || ''}"><i class="st" style="background:${tone[t]}"></i>
    <div style="color:${tone[t]}">${ic(icon, 15, 1.8)}</div><div class="${t === 'bad' ? 'bad' : t === 'good' ? 'good' : ''}">${name}</div><div class="dim">${type}</div><div class="num">${dist}</div><div class="num dim">${speed}</div></div>`).join('')}</div>
  <div class="foot"><span>14 of 31 here</span><span class="sp"></span><span>ships, drones, batteries</span></div></div>`);

// ---- The ship's own console: its state and its speed, and beside them its modules in three rows
// (high over mid over low), each row as long as it needs to be.
const mod = (icon, key, ammo, cls, sweep) => `<div class="mod ${cls}">${key ? `<span class="k">${key}</span>` : ''}${icon ? ic(icon, 22, 1.5) : ''}${ammo ? `<span class="a">${ammo}</span>` : ''}
  ${sweep ? `<span class="cy"><i style="width:${sweep}%"></i></span>` : ''}</div>`;
const rackRow = (label, mods) => `<div class="rack"><span class="rackl">${label}</span>${mods.join('')}</div>`;
put(`<div class="hud" style="left:520px;top:928px;width:620px;height:140px;display:grid;grid-template-columns:286px 1fr;">
  <div style="padding:12px 14px;border-right:1px solid var(--line)"><div class="stat">
    <span class="dim">Shield</span><div class="bar2"><i style="width:100%;background:var(--shield)"></i></div><span class="num">350 <span class="faint">/ 350</span></span>
    <span class="dim">Armour</span><div class="bar2"><i style="width:84%;background:var(--armor)"></i></div><span class="num">984 <span class="faint">/ 1,171</span></span>
    <span class="dim">Hull</span><div class="bar2"><i style="width:100%;background:var(--hull)"></i></div><span class="num">370 <span class="faint">/ 370</span></span></div>
    <div style="display:flex;align-items:baseline;margin:11px 0 4px"><span class="dim">Capacitor</span><span class="sp"></span><span class="good" style="font-size:12px;margin-right:8px">holds at 62%</span><span>262 <span class="faint">/ 305</span></span></div>
    <div class="cells">${Array.from({ length: 20 }, (_, i) => `<i class="${i < 17 ? 'f' : ''}"></i>`).join('')}</div></div>
  <div style="padding:12px 14px;display:flex;flex-direction:column">
    <div style="display:flex;align-items:flex-end;gap:10px"><span class="b6" style="font-size:34px;line-height:0.9">212</span><span class="dim" style="padding-bottom:2px">m/s &nbsp;of 325</span><span class="sp"></span><span class="btn big danger" style="width:84px">STOP</span></div>
    <div class="bar2" style="margin-top:10px;height:6px"><i style="width:65%;background:var(--accent)"></i></div>
    <div style="margin-top:10px"><span class="acc b5">Orbiting</span> Pirate Raider <span class="dim">at 5.0 km</span></div>
    <div class="dim" style="font-size:13px;margin-top:2px">Camera follows your target &nbsp;<span class="k" style="border:1px solid var(--line2);padding:0 5px;font-size:12px">C</span></div></div></div>
  <div style="position:absolute;left:1150px;top:928px;display:grid;gap:4px">
    ${rackRow('HIGH', [mod('gun', 'F1', '118', 'on', 62), mod('gun', 'F2', '118', 'on', 40), mod('gun', 'F3', '117', 'on', 78), mod('gun', 'F4', '118', 'on', 14),
      mod('missile', 'F5', '29', 'on', 28), mod('missile', 'F6', '30', 'on', 56), mod('module', 'F7', '', ''), mod('', '', '', 'empty')])}
    ${rackRow('MID', [mod('engine', 'F8', '', 'on', 100), mod('module', '', '', ''), mod('module', '', '', ''), mod('shield', '', '', 'passive'), mod('shield', '', '', 'passive')])}
    ${rackRow('LOW', [mod('plate', '', '', 'on', 35), mod('module', '', '', ''), mod('plate', '', '', 'passive'), mod('plate', '', '', 'passive'), mod('module', '', '', 'passive'), mod('module', '', '', 'passive')])}
  </div>
  <div class="tip" style="left:1300px;top:872px">Light Missile Launcher &nbsp;<span class="good">firing</span><span class="k">F5</span><div class="t2">Breaker Light Missile, 29 left &nbsp;-&nbsp; reloads in 10 s &nbsp;-&nbsp; reaches 18.8 km</div></div>`);

// ---- Drones and the fleet: a line each, beside the dock.
put(`<div class="hud" style="left:64px;top:976px;width:440px;height:42px;display:flex;align-items:center;gap:8px;padding:0 10px">
    <span class="h">Drones</span><span>2 out</span><span class="dim">3 aboard</span><span class="sp"></span><span class="btn sm off">Launch</span><span class="btn sm">Engage</span><span class="btn sm">Recall</span></div>
  <div class="hud" style="left:64px;top:1026px;width:440px;height:42px;display:flex;align-items:center;gap:8px;padding:0 10px">
    <span class="h">Fleet &nbsp;1</span><span class="good">Pell Ulenis</span>
    <div style="display:grid;gap:2px;width:54px"><div class="bar2" style="height:3px"><i style="width:60%;background:var(--shield)"></i></div><div class="bar2" style="height:3px"><i style="width:100%;background:var(--armor)"></i></div><div class="bar2" style="height:3px"><i style="width:100%;background:var(--hull)"></i></div></div>
    <span class="dim">engaging</span><span class="sp"></span><span class="btn sm">Orders ${ic('up', 11, 2.2)}</span></div>`);

// ---- What is out there, in the scene.
const br = (x, y, color, label, sub, size = 30, gap = 8) => `<div class="br" style="left:${x}px;top:${y}px;color:${color};width:${size}px;height:${size}px"><i></i><b></b></div>
  <div class="brl" style="left:${x + size + gap}px;top:${y + size / 2 - 16}px;color:${color}">${label}<div style="color:var(--text);font-weight:400;font-size:12px">${sub}</div></div>`;
put(br(1232, 388, 'var(--bad)', 'Pirate Raider', '7.2 km', 38, 26) + br(1392, 236, 'var(--bad)', 'Pirate Scout', '15.6 km') + br(742, 668, 'var(--good)', 'Pell Ulenis', '2.1 km')
  + br(336, 440, 'rgba(160,190,220,0.8)', 'Refinery 1', '3.6 km', 26)
  + `<svg width="70" height="70" style="position:absolute;left:1216px;top:372px"><circle cx="35" cy="35" r="30" fill="none" stroke="#e0604f" stroke-width="1.5" stroke-dasharray="12 8"/></svg>`);
</script>
</body></html>
